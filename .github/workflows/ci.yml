name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-desktop:
    name: Desktop Tests & Validation
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          cd "typebridge desktop assistant"
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Desktop Automated Validation Suite
        run: |
          cd "typebridge desktop assistant"
          python test_typing.py
          python -m unittest test_update_logic.py -v
          python test_network_resilience.py

  test-android:
    name: Android Lint & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: |
          cd "typebridge android"
          chmod +x gradlew

      - name: Run Android Lint & Check
        run: |
          cd "typebridge android"
          ./gradlew check --no-daemon
