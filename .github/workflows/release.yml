name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission
        run: |
          cd "typebridge android"
          chmod +x gradlew

      - name: Setup Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          cd "typebridge android/app"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > typebridge-release.keystore
            echo "Keystore successfully decoded from GitHub Secrets."
          else
            echo "Notice: KEYSTORE_BASE64 secret not found. Generating ephemeral signing keystore for CI..."
            EPHEMERAL_PASS=$(openssl rand -hex 16)
            echo "KEYSTORE_STORE_PASSWORD=$EPHEMERAL_PASS" >> $GITHUB_ENV
            echo "KEYSTORE_KEY_PASSWORD=$EPHEMERAL_PASS" >> $GITHUB_ENV
            echo "KEYSTORE_KEY_ALIAS=typebridge" >> $GITHUB_ENV
            keytool -genkeypair -v -keystore typebridge-release.keystore -alias "typebridge" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$EPHEMERAL_PASS" -keypass "$EPHEMERAL_PASS" -dname "CN=TypeBridge, OU=Release, O=TypeBridge, L=Global, ST=Global, C=US"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PATH: "typebridge-release.keystore"
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || env.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEY_ALIAS || env.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD || secrets.KEYSTORE_PASSWORD || env.KEYSTORE_KEY_PASSWORD }}
        run: |
          cd "typebridge android"
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: typebridge android/app/build/outputs/apk/release/app-release.apk

  build-windows:
    name: Build Windows Setup Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Install Python Dependencies
        run: |
          cd "typebridge desktop assistant"
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Desktop Executable & Installer
        run: |
          cd "typebridge desktop assistant"
          python build_desktop.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-exe
          path: typebridge desktop assistant/installer_output/TypeBridgeSetup-*.exe

  publish-release:
    name: Package Manifest & Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release_assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release-exe
          path: release_assets/

      - name: Prepare Assets & Calculate Checksums
        id: prep
        run: |
          cd release_assets/
          mv app-release.apk TypeBridge-Android-${{ github.ref_name || inputs.tag_name }}.apk 2>/dev/null || true
          
          # Generate SHA256 sums
          sha256sum * > sha256sums.txt
          cat sha256sums.txt

      - name: Generate Release Manifest
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          VER="${TAG#v}"
          
          APK_NAME="TypeBridge-Android-${TAG}.apk"
          EXE_NAME="TypeBridgeSetup-${TAG}.exe"
          
          APK_SHA=$(sha256sum "release_assets/${APK_NAME}" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "release_assets/${APK_NAME}")
          
          EXE_SHA=$(sha256sum release_assets/TypeBridgeSetup-*.exe | head -n 1 | awk '{print $1}')
          EXE_SIZE=$(stat -c%s release_assets/TypeBridgeSetup-*.exe | head -n 1)
          
          cat <<EOF > release_assets/release-manifest.json
          {
            "schemaVersion": 1,
            "version": "${VER}",
            "channel": "stable",
            "minimumSupportedVersion": "1.0.0",
            "android": {
              "versionCode": 1,
              "assets": [
                {
                  "name": "${APK_NAME}",
                  "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}",
                  "size": ${APK_SIZE},
                  "sha256": "${APK_SHA}"
                }
              ]
            },
            "windows": {
              "version": "${VER}",
              "assets": [
                {
                  "name": "${EXE_NAME}",
                  "url": "https://github.com/${{ github.repository }}/releases/download/${TAG}/${EXE_NAME}",
                  "size": ${EXE_SIZE},
                  "sha256": "${EXE_SHA}"
                }
              ]
            }
          }
          EOF
          cat release_assets/release-manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: TypeBridge ${{ github.ref_name || inputs.tag_name }}
          body: |
            ## TypeBridge ${{ github.ref_name || inputs.tag_name }} — Production Release
            
            ### What's New:
            - **Universal Android Compatibility**: Guaranteed installation on all Android OEMs (Samsung, Xiaomi/MIUI/HyperOS, Oppo, Vivo, OnePlus, Realme, Motorola, Google Pixel) from Android 8.0 through Android 15.
            - **Self-Healing Connections**: Exponential backoff reconnection, automatic session key persistence, and half-open socket detection.
            - **Zero Duplication**: Deduplication cache guarantees text is never typed twice after network interruptions.
            - **Seamless Auto-Updates**: SHA-256 cryptographically verified in-place updates.
            
            ### Release Assets:
            - **Windows Setup**: `TypeBridgeSetup-${{ github.ref_name || inputs.tag_name }}.exe`
            - **Android APK**: `TypeBridge-Android-${{ github.ref_name || inputs.tag_name }}.apk`
            - **Integrity**: `release-manifest.json` and `sha256sums.txt`
          files: release_assets/*
