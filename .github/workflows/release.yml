name: Production Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Signed Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission
        run: |
          cd "typebridge android"
          chmod +x gradlew

      - name: Setup Keystore & Signing Credentials
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
        run: |
          cd "typebridge android/app"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > typebridge-release.keystore
            echo "Keystore successfully decoded from GitHub Secrets."
          else
            echo "::error::KEYSTORE_BASE64 secret is not configured in repository secrets! Production releases require the persistent release keystore. Aborting."
            exit 1
          fi

          PASS="${KEYSTORE_STORE_PASSWORD:-${KEYSTORE_PASSWORD}}"
          KEY_PASS="${KEYSTORE_KEY_PASSWORD:-$PASS}"
          ALIAS="${KEYSTORE_KEY_ALIAS:-${KEY_ALIAS:-typebridge}}"

          echo "KEYSTORE_PATH=typebridge-release.keystore" >> $GITHUB_ENV
          echo "KEYSTORE_STORE_PASSWORD=$PASS" >> $GITHUB_ENV
          echo "KEYSTORE_KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          echo "KEYSTORE_KEY_ALIAS=$ALIAS" >> $GITHUB_ENV

      - name: Build Release APK
        run: |
          cd "typebridge android"
          ./gradlew assembleRelease --no-daemon

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-release-apk
          path: typebridge android/app/build/outputs/apk/release/app-release.apk

  build-windows:
    name: Build Windows Setup Installer
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Install Python Dependencies
        run: |
          cd "typebridge desktop assistant"
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Desktop Executable & Installer
        run: |
          cd "typebridge desktop assistant"
          python build_desktop.py

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-exe
          path: typebridge desktop assistant/installer_output/TypeBridgeSetup-*.exe

  publish-release:
    name: Package Manifest & Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref_name }}

      - name: Download Android Artifact
        uses: actions/download-artifact@v4
        with:
          name: android-release-apk
          path: release_assets/

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-release-exe
          path: release_assets/

      - name: Prepare Assets & Calculate Checksums
        id: prep
        run: |
          cd release_assets/
          TAG="${{ github.ref_name || inputs.tag_name }}"
          APK_NAME="TypeBridge-Android-${TAG}.apk"
          EXE_NAME="TypeBridgeSetup-${TAG}.exe"
          
          # Rename Android APK to tag-specific canonical name
          if [ -f app-release.apk ]; then
            mv app-release.apk "${APK_NAME}"
          fi
          
          # Rename Windows setup installer to tag-specific canonical name
          SETUP_SRC=$(ls TypeBridgeSetup-*.exe 2>/dev/null | head -n 1)
          if [ -n "$SETUP_SRC" ] && [ "$SETUP_SRC" != "${EXE_NAME}" ]; then
            mv "$SETUP_SRC" "${EXE_NAME}"
          fi
          
          # Validate that both primary binary assets exist and are non-empty
          if [ ! -f "${APK_NAME}" ] || [ $(stat -c%s "${APK_NAME}") -lt 1000000 ]; then
            echo "::error::Required asset ${APK_NAME} is missing or incomplete!"
            exit 1
          fi
          if [ ! -f "${EXE_NAME}" ] || [ $(stat -c%s "${EXE_NAME}") -lt 5000000 ]; then
            echo "::error::Required asset ${EXE_NAME} is missing or incomplete!"
            exit 1
          fi

          # Generate clean SHA-256 sums only for the production binaries
          sha256sum "${APK_NAME}" "${EXE_NAME}" > sha256sums.txt
          cat sha256sums.txt

      - name: Generate Release Manifest
        run: |
          TAG="${{ github.ref_name || inputs.tag_name }}"
          VER="${TAG#v}"
          
          APK_NAME="TypeBridge-Android-${TAG}.apk"
          EXE_NAME="TypeBridgeSetup-${TAG}.exe"
          
          APK_SHA=$(sha256sum "release_assets/${APK_NAME}" | awk '{print $1}')
          APK_SIZE=$(stat -c%s "release_assets/${APK_NAME}")
          
          EXE_SHA=$(sha256sum "release_assets/${EXE_NAME}" | awk '{print $1}')
          EXE_SIZE=$(stat -c%s "release_assets/${EXE_NAME}")
          
          # Read actual versionCode from gradle configuration
          VERSION_CODE=$(grep -oE 'versionCode\s*=\s*[0-9]+' "typebridge android/app/build.gradle.kts" | grep -oE '[0-9]+' | head -n 1)
          if [ -z "$VERSION_CODE" ]; then
            VERSION_CODE=1
          fi
          
          python3 -c "
          import json
          manifest = {
            'schemaVersion': 1,
            'version': '${VER}',
            'channel': 'stable',
            'minimumSupportedVersion': '1.0.0',
            'android': {
              'versionCode': int('${VERSION_CODE}'),
              'assets': [{
                'name': '${APK_NAME}',
                'url': 'https://github.com/${{ github.repository }}/releases/download/${TAG}/${APK_NAME}',
                'size': int('${APK_SIZE}'),
                'sha256': '${APK_SHA}'
              }]
            },
            'windows': {
              'version': '${VER}',
              'assets': [{
                'name': '${EXE_NAME}',
                'url': 'https://github.com/${{ github.repository }}/releases/download/${TAG}/${EXE_NAME}',
                'size': int('${EXE_SIZE}'),
                'sha256': '${EXE_SHA}'
              }]
            }
          }
          with open('release_assets/release-manifest.json', 'w') as f:
            json.dump(manifest, f, indent=2)
          "
          cat release_assets/release-manifest.json

      - name: Validate Release Assets Integrity
        run: |
          cd release_assets/
          TAG="${{ github.ref_name || inputs.tag_name }}"
          for f in "TypeBridge-Android-${TAG}.apk" "TypeBridgeSetup-${TAG}.exe" release-manifest.json sha256sums.txt; do
            if [ ! -f "$f" ]; then
              echo "::error::Asset $f was not generated!"
              exit 1
            fi
            echo "Verified asset: $f ($(stat -c%s "$f") bytes)"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || inputs.tag_name }}
          name: TypeBridge ${{ github.ref_name || inputs.tag_name }}
          body: |
            ## TypeBridge ${{ github.ref_name || inputs.tag_name }} — Production Release
            
            ### What's New:
            - **Universal Android Compatibility**: Guaranteed installation on all Android OEMs (Samsung, Xiaomi/MIUI/HyperOS, Oppo, Vivo, OnePlus, Realme, Motorola, Google Pixel) from Android 8.0 through Android 15.
            - **Self-Healing Connections**: Exponential backoff reconnection, automatic session key persistence, and half-open socket detection.
            - **Zero Duplication**: Deduplication cache guarantees text is never typed twice after network interruptions.
            - **Seamless Auto-Updates**: SHA-256 cryptographically verified in-place updates.
            
            ### Release Assets:
            - **Windows Setup**: `TypeBridgeSetup-${{ github.ref_name || inputs.tag_name }}.exe`
            - **Android APK**: `TypeBridge-Android-${{ github.ref_name || inputs.tag_name }}.apk`
            - **Integrity**: `release-manifest.json` and `sha256sums.txt`
          files: release_assets/*
